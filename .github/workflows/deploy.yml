# Publica en Firebase Hosting:
#  - push a main      → sitio en vivo
#  - pull request     → URL de vista previa (expira en 7 días) comentada en el PR
# Requiere el secreto FIREBASE_SERVICE_ACCOUNT (ver README → "Deploy automático").
name: Deploy a Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build (valida negocio.js y arma dist/)
        run: node build.mjs
      - name: Publicar
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
          expires: 7d
